imu_broadcaster:
  ros__parameters:

    sensor_name: mpu6050
    frame_id: imu_link
   
   # 500 data points used to calculated covariances
    static_covariance_orientation: [1.1268e-05, 0.0, 0.0, 7.77565e-39, 0.0, 0.0, 5.31292e-08, 0.0, 0.0]
    static_covariance_angular_velocity: [7.6968e-07, 0.0, 0.0, 7.431e-07, 0.0, 0.0, 4.16054e-07, 0.0, 0.0]
    static_covariance_linear_acceleration: [0.0, 0.0, 0.0, 0.00112715, 0.0, 0.0, 0.00141238, 0.0, 0.0]





